<!DOCTYPE html>
<!--
  ============================================================================
  ПЯТЬ ЯЗЫКОВ ЛЮБВИ · Genesis Solar Life
  Устроен так же, как основная анкета «Открытие Пути»: таймер на вопрос
  и приоритеты 1 · 2 · 3. Оформление целиком из ../css/style.css,
  своё — только love.css.

    content-ru.js / content-ua.js — весь текст: вступление, 20 вопросов,
                                    описания языков и рекомендации
    script.js                     — логика

  Концепция пяти языков любви — Гэри Чепмен.
  Формулировки вопросов и рекомендаций оригинальные.
  ============================================================================
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090E">
<meta name="color-scheme" content="dark">
<title>ПЯТЬ ЯЗЫКОВ ЛЮБВИ | Genesis Solar Life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FBF5B7'/%3E%3Cstop offset='0.5' stop-color='%23D4AF37'/%3E%3Cstop offset='1' stop-color='%238A6417'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 58 8 34a14 14 0 0 1 24-14 14 14 0 0 1 24 14Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="love.css">
</head>
<body>

<div class="app">

  <header class="brand">
    <div class="lang-switch no-print" id="lang-switch"></div>
    <div class="brand-tag" id="brand-tag"></div>
    <h1 class="brand-title shimmer-text" id="brand-title"></h1>
    <div class="divider"><i></i></div>
    <p class="brand-sub" id="brand-sub"></p>
  </header>

  <!-- ЭКРАН 1 · СТАРТ. Все тексты приходят из языкового файла. -->
  <section id="screen-intro" class="screen">
    <p class="intro-lead" id="intro-lead"></p>

    <!-- Зачем этот тест и что он снимает -->
    <div class="block">
      <div class="block-title" id="why-title"></div>
      <div id="why-body"></div>
      <div class="spacer-m"></div>
      <div class="sub-label" id="closes-title"></div>
      <ul class="task-list" id="closes-list"></ul>
      <p class="vector-desc closes-after" id="closes-after"></p>
    </div>

    <div class="intro-note" id="intro-note"></div>
    <div class="badges" id="intro-badges"></div>

    <div class="field">
      <label for="user-name" id="name-label"></label>
      <input id="user-name" type="text" maxlength="40" autocomplete="name" spellcheck="false">
    </div>

    <button id="btn-start"  class="btn btn-gold pulse"></button>
    <button id="btn-resume" class="btn btn-ghost hidden" style="margin-top:11px"></button>
    <button id="btn-last"   class="btn btn-ghost hidden" style="margin-top:11px"></button>

    <p class="legal" id="intro-author"></p>
  </section>

  <!-- ЭКРАН 2 · ВОПРОСЫ
       На узких экранах шапка с таймером прилипает сверху,
       кнопка «Далее» — снизу. Правила те же, что в основной анкете. -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-head">
      <div class="quiz-top">
        <div class="q-counter" id="q-counter"></div>
        <div class="timer-box">
          <div class="timer-digits" id="timer-digits">60</div>
          <div class="timer-label" id="timer-label"></div>
        </div>
      </div>

      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="q-track"><div class="q-fill" id="q-fill"></div></div>
    </div>

    <h2 class="q-title" id="q-title"></h2>

    <div class="options" id="options"></div>

    <button id="btn-next" class="btn btn-gold" disabled></button>
    <button id="btn-back" class="btn btn-ghost hidden" style="margin-top:11px"></button>
  </section>

  <!-- ЭКРАН 3 · РЕЗУЛЬТАТ (собирается в script.js) -->
  <section id="screen-result" class="screen hidden"></section>

</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" id="toast-icon">💛</div>
  <div class="toast-text" id="toast-text"></div>
</div>

<script src="content-ru.js"></script>
<script src="content-ua.js"></script>
<script src="script.js"></script>
</body>
</html>
